[workspace]
members = [
    "crates/rclone-crypt",
    "crates/rclone-crypt-aws",
    "crates/rclone-crypt-http",
    "examples/axum-proxy",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
aes = "0.8.4"
async-trait = "0.1.89"
aws-config = "1.8.18"
aws-sdk-s3 = "1.137.0"
axum = "0.8.9"
base64 = "0.22.1"
bytes = "1.10.1"
crypto_secretbox = "0.1.1"
ctr = "0.9.2"
data-encoding = "2.9.0"
futures-util = "0.3.31"
getrandom = "0.4.3"
http = "1.3.1"
http-body = "1.0.1"
http-body-util = "0.1.3"
mime_guess = "2.0.5"
scrypt = "0.12.0"
sha2 = "0.10.9"
subtle = "2.6.1"
tempfile = "3.23.0"
thiserror = "2.0.16"
tokio = "1.48.0"
tokio-util = "0.7.18"
zeroize = "1.8.1"
